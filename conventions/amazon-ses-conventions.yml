  location: query string
  terminates_when: NextToken is absent from the response
  error: InvalidNextTokenException when the cursor is malformed or expired
  note: Used by the 16 List* operations; PageSize appears on the paginated operations only.
request_tracing:
  response_header: x-amzn-RequestId
  note: Every SES response carries x-amzn-RequestId. Include it when contacting AWS Support.
