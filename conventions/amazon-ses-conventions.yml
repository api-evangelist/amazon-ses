  style: REST-JSON (AWS restJson1)
  transport: HTTPS only
  content_type: application/json
  base_url: https://email.{region}.amazonaws.com
  regional: true
  note: SES is a regional service. Every request is scoped to one AWS Region; there is no global endpoint. A multi-region
    global endpoint feature exists for sending resilience but the control plane stays regional.
authentication:
  style: AWS Signature Version 4
  header: Authorization
  supporting_headers:
  - X-Amz-Date
  - X-Amz-Security-Token
  - X-Amz-Content-Sha256
  alternative: SMTP interface with SES SMTP credentials (derived from IAM), ports 25/465/587/2465/2587
  artifact: authentication/amazon-ses-authentication.yml
idempotency:
  supported: false
  note: Amazon SES v2 publishes NO idempotency-key mechanism. There is no Idempotency-Key header and no ClientToken/ClientRequestToken
    parameter anywhere in the 86-operation SES v2 contract (grep of the harvested spec returns zero matches for
    both). Retrying SendEmail after a timeout can therefore send the message twice. Creates are name-addressed,
    so re-issuing a create returns AlreadyExistsException rather than duplicating the resource — that is name collision,
    not idempotency. Callers who need send-level dedupe must implement it themselves (for example an application-side
    key persisted before the call).
