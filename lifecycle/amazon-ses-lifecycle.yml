versioning:
  scheme: dated API version, with a URI path prefix
  api_version: '2019-09-27'
  path_prefix: /v2/email
  current: v2
  docs: https://docs.aws.amazon.com/ses/latest/APIReference-V2/Welcome.html
  note: >-
    Two SES API contracts are live at once. SES v1 (API version 2010-12-01) is the original query-protocol API;
    SES v2 (2019-09-27) is the REST-JSON API this repo profiles. AWS does not version by header or by date
    train — the version is baked into the service model and the request path.
  previous_versions:
    - version: '2010-12-01'
      name: Amazon SES API (v1 / classic)
      docs: https://docs.aws.amazon.com/ses/latest/APIReference/
      status: available
      note: >-
        Still supported and still shipped in every AWS SDK (aws-sdk-ses, boto3 client 'ses'). AWS steers new
        work to v2 — the quotas page tells v1 users with messages over 10 MB to "consider migrating to the
        SES v2 API" — but publishes no end-of-life date for v1.
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  finding: >-
    No SES-level deprecation policy was found. AWS publishes no Sunset or Deprecation response header for SES,
    no deprecated: true operation anywhere in the 86-operation v2 spec, and no dated end-of-life notice for
    the v1 API. The closest published artefact is the AWS SDKs and Tools maintenance policy
    (https://docs.aws.amazon.com/sdkref/latest/guide/maint-policy.html), which governs SDK major versions and
    language runtimes — not the SES API contract — so it is recorded here as context and is deliberately NOT
    wired as a Deprecation pointer.
  related_sdk_policy: https://docs.aws.amazon.com/sdkref/latest/guide/maint-policy.html
  observed_sdk_deprecation:
    - AWS SDK for JavaScript v2 (npm aws-sdk) is in maintenance mode; last release 2025-12-09 against a daily v3 cadence.
