      customers instead get up to $200 in AWS Free Tier credits over six months, usable against SES.
    source: https://aws.amazon.com/blogs/messaging-and-targeting/introducing-amazon-simple-email-service-ses-pricing-plans/
  - name: Amazon Pinpoint event destination
    status: available
    detail: Retained as an SES event-destination type; recorded here because Pinpoint itself is being wound down by AWS.
