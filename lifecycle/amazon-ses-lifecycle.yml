status_page: https://health.aws.amazon.com/health/status
status_page_note: >-
  The AWS Health Dashboard is the public status surface. It covers SES per-region alongside every other AWS
  service; there is no ses.status page.
support_policy:
  production_access_review: https://docs.aws.amazon.com/ses/latest/dg/faqs-enforcement.html
  note: >-
    SES runs a sending review process that can pause an account's sending ability (SendingPausedException,
    AccountSuspendedException). That enforcement lifecycle is a real operational state machine and is
    documented in the Sending review process FAQs.
regional_availability:
  note: >-
    SES is a regional service. The harvested v2 spec enumerates 23 commercial regions plus us-gov-west-1 and
    us-gov-east-1, with separate endpoints for China (cn-north-1, cn-northwest-1) on amazonaws.com.cn.
