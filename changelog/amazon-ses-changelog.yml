note: >-
  Amazon SES publishes no dated changelog of its own. There is no /ses/whats-new page (probed 2026-08-13,
  404) and the SES Developer Guide's document-history page is not exposed in the docs markdown or llms.txt
  index. The dated record below is assembled from two first-party feeds AWS does publish: the AWS What's New
  announcements directory (queried through https://aws.amazon.com/api/dirs/items/search and the recent RSS
  feed) and the AWS Messaging and Targeting blog, whose SES posts are mirrored into blogs/ in this repo.
  This is a recent window, not a full history.
scheme:
  api_versioning: dated API version baked into the service model
  current_version: '2019-09-27'
  release_cadence: continuous — features ship without an API version bump
  breaking_change_policy: >-
    None published for SES. AWS's practice is additive: new fields and operations are added to the existing
    2019-09-27 model rather than cutting a new version. See lifecycle/amazon-ses-lifecycle.yml.
entries:
  - date: '2026-08-07'
    type: additions
    breaking: false
    highlight: SES identifies automated open and click events in event notifications.
    detail: >-
      Event notifications now signal when an open or click was machine-generated (security scanners, link
      prefetchers) rather than performed by a human, so engagement metrics can exclude them.
    url: https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ses-automated-email-interactions/
    affects: [event-publishing]
  - date: '2026-07-21'
    type: commercial
    breaking: false
    highlight: Amazon SES pricing plans launched — Essentials, Pro and Enterprise.
    detail: >-
      Three packaged plans replace add-on-by-add-on purchasing, at up to 22% less than buying the features
      individually. All new SES accounts start on Essentials, as do returning customers who have not sent
      since 2025-06-01. Existing senders stay on a-la-carte pricing and can switch at any time. The
      SES-specific free tier (3,000 message charges/month for 12 months) closed to new customers on this date.
    url: https://aws.amazon.com/blogs/messaging-and-targeting/introducing-amazon-simple-email-service-ses-pricing-plans/
    affects: [pricing, billing, console]
  - date: '2026-07-07'
    type: additions
    breaking: false
    highlight: Per-tenant email suppression isolation.
    detail: Suppression lists can be isolated per tenant rather than shared across the account.
    url: https://aws.amazon.com/blogs/messaging-and-targeting/isolate-email-suppression-per-tenant-with-amazon-ses/
    affects: [tenants, suppression]
