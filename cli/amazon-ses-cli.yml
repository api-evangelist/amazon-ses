      commands: [create-import-job, get-import-job, list-import-jobs]
    - name: metrics
      commands: [batch-get-metric-data, create-export-job, get-export-job, list-export-jobs, list-recommendations]
    - name: tags
      commands: [tag-resource, untag-resource, list-tags-for-resource]
key_flows:
  - name: Verify a sending domain and read its DKIM tokens
    commands:
      - aws sesv2 create-email-identity --email-identity example.com
      - aws sesv2 get-email-identity --email-identity example.com
  - name: Send a test message through the mailbox simulator
    commands:
      - >-
        aws sesv2 send-email --from-email-address sender@example.com
        --destination ToAddresses=success@simulator.amazonses.com
        --content 'Simple={Subject={Data=Test},Body={Text={Data=Hello}}}'
  - name: Check where the account sits against its sending quota
    commands:
      - aws sesv2 get-account
  - name: Wire event publishing to an SNS topic
    commands:
      - aws sesv2 create-configuration-set --configuration-set-name my-set
      - >-
        aws sesv2 create-configuration-set-event-destination --configuration-set-name my-set
        --event-destination-name to-sns --event-destination
        'Enabled=true,MatchingEventTypes=[BOUNCE,COMPLAINT,DELIVERY],SnsDestination={TopicArn=arn:aws:sns:us-east-1:123456789012:ses-events}'
