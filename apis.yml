name: Amazon SES
description: >-
  Amazon Simple Email Service (SES) is AWS's cloud email platform for sending and receiving mail at scale —
  marketing, notification and transactional. The current contract is the SES v2 API (version 2019-09-27), an
  86-operation REST-JSON service authenticated with AWS Signature Version 4 and reached at a regional endpoint,
  alongside an SMTP submission interface on ports 25/465/587/2465/2587. It covers email sending and templated
  bulk sends, domain and address identity verification with DKIM, SPF and DMARC alignment, configuration sets
  and event publishing to SNS, EventBridge, CloudWatch and Firehose, contact lists and subscription topics,
  account and configuration-set suppression lists, dedicated IP pools both managed and standard, tenants for
  per-workload reputation isolation, and Virtual Deliverability Manager for inbox placement and reputation
  reporting. Mail Manager adds inbound processing with ingress points, traffic policies, rule sets, relays and
  archives. Every new account starts in the SES sandbox, and a published mailbox simulator forces delivery,
  bounce, complaint and out-of-office outcomes on demand.
